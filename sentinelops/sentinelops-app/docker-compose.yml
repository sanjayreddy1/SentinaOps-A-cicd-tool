# SentinelOps - full microservices stack (all 6 services + Valkey).
# Run from this directory:  docker compose up --build
# Frontend: http://localhost:4173   Console API: http://localhost:8001
# GitHub webhook target: POST http://localhost:8001/webhooks/github

services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: so-valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build: ./services/api-gateway
    container_name: so-api-gateway
    environment:
      CATALOG_URL: http://catalog:8000
      ORDERS_URL: http://orders:8080
      PAYMENTS_URL: http://payments:8080
    ports:
      - "8080:8080"
    depends_on:
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    build: ./services/catalog
    container_name: so-catalog
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders:
    build: ./services/orders
    container_name: so-orders
    environment:
      VALKEY_URL: redis://valkey:6379/0
      STREAM_NAME: orders
    ports:
      - "8081:8080"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  payments:
    build: ./services/payments
    container_name: so-payments
    environment:
      VALKEY_URL: redis://valkey:6379/0
      STREAM_NAME: orders
    ports:
      - "8082:8080"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  console:
    build: ../sentinelops-console/backend
    container_name: so-console
    environment:
      CORS_ORIGINS: "http://localhost:4173,http://127.0.0.1:4173,http://localhost:5173"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./services/frontend
      args:
        VITE_API_BASE_URL: http://localhost:8001
    container_name: so-frontend
    ports:
      - "4173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      console:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 10
