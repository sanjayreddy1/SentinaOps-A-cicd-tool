name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "main"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  # ---- Build the React console/shop static site ----
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sentinelops/sentinelops-app/services/frontend/package-lock.json
      - name: Install & build frontend
        working-directory: sentinelops/sentinelops-app/services/frontend
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sentinelops/sentinelops-app/services/frontend/dist

  # ---- Deploy the uploaded artifact to GitHub Pages ----
  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---- Promote the scanned images to the GitOps repo (ArgoCD then syncs) ----
  promote-gitops:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        continue-on-error: true
        id: gitops_checkout
        with:
          repository: ${{ vars.GITOPS_REPOSITORY || 'sanjuportfolio/sentinelops-gitops' }}
          token: ${{ secrets.GITOPS_TOKEN || secrets.GITHUB_TOKEN }}
          path: sentinelops-gitops

      - name: Set image digests in dev overlay
        if: steps.gitops_checkout.outcome == 'success'
        working-directory: sentinelops-gitops/workloads/overlays/dev
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for svc in api-gateway catalog orders payments frontend console; do
            image="ghcr.io/${REPO}/${svc}"
            echo "Promoting ${image} to sha-${SHA::7}"
          done
